<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Semester Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        header button {
            background-color: white;
            color: #007bff;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        header button:hover {
            background-color: #e3f2fd;
        }

        .student-card {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h3 {
            text-align: center;
            color: #007bff;
            margin-top: 30px;
        }

        #cy {
            width: 70%;
            height: 600px;
            margin: 20px auto;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 8px;
        }

        .controls {
            text-align: center;
            margin: 20px;
        }

        .controls button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 10px;
        }

        .controls button:hover {
            background-color: #0056b3;
        }

        .summary {
            text-align: center;
            margin: 15px auto;
            padding: 10px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 8px;
            width: 80%;
        }
    </style>

    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre/cytoscape-dagre.js"></script>
</head>

<body>
    <header>
        <h2>Welcome, <span th:text="${student.name}"></span></h2>
        <form th:action="@{/auth/login}" method="get">
            <button type="submit">Logout</button>
        </form>
    </header>

    <div class="student-card">
        <p>
            <strong>Email:</strong> <span th:text="${student.email}"></span><br>
            <strong>Degree:</strong> <span th:text="${student.degree}"></span><br>
            <strong>Year:</strong> <span th:text="${student.year}"></span><br>
            <strong>GPA:</strong> <span th:text="${student.gpa}"></span>
        </p>
    </div>

    <h3 id="sem-header">Semester Planner Flowchart (Semester 1)</h3>
    <div id="cy"></div>

    <div class="controls">
        <button id="save-plan-btn">💾 Save Semester Plan</button>
        <button id="discard-plan-btn">🔁 Discard Semester Plan</button>
    </div>

    <div class="summary" id="summary-box">No courses selected yet.</div>

    <script th:inline="javascript">
        let cy;
        let currentSemester = 1;
        const selectedBySemester = {};
        const studentEmail = [[${ student.email }]];
        let courseLabelMap = {}; 

        function loadGraph() {
            fetch(`/api/courses/semester-graph?email=${studentEmail}&semester=${currentSemester}`)
                .then(res => res.json())
                .then(data => {
                    if (cy) cy.destroy();

                    courseLabelMap = {};
                    data.nodes.forEach(node => courseLabelMap[node.data.id] = node.data.label);

                    cy = cytoscape({
                        container: document.getElementById('cy'),
                        elements: data.nodes.concat(data.edges),
                        style: [
                            {
                                selector: 'node',
                                style: {
                                    'label': ele => {
                                        const id = ele.data('id');
                                        for (const [sem, set] of Object.entries(selectedBySemester)) {
                                            if (set.has(id)) return `${ele.data('label')} (Sem ${sem})`;
                                        }
                                        return ele.data('label');
                                    },
                                    'text-valign': 'center',
                                    'text-halign': 'center',
                                    'text-wrap': 'wrap',              
                                    'text-max-width': '120px',    
                                    'overflow-wrap': 'break-word',  
                                    'background-color': ele => {
                                        const id = ele.data('id');
                                        for (const [sem, set] of Object.entries(selectedBySemester)) {
                                            if (set.has(id)) return '#e67e22';
                                        }
                                        const s = ele.data('status');
                                        if (s === 'enrolled') return '#2ecc71';
                                        if (s === 'eligible') return '#3498db';
                                        return '#bdc3c7';
                                    },
                                    'color': 'black',
                                    'shape': 'roundrectangle',
                                    'padding': '15px',              
                                    'width': 'label',       
                                    'height': 'label',     
                                    'min-width': '120px',       
                                    'min-height': '60px',        
                                    'border-width': ele => ele.data('status') === 'eligible' ? 2 : 0,
                                    'border-color': '#2980b9',
                                    'font-size': '15px'
                                }
                            },
                            {
                                selector: 'edge',
                                style: {
                                    'width': 2,
                                    'line-color': '#999',
                                    'target-arrow-color': '#999',
                                    'target-arrow-shape': 'triangle',
                                    'curve-style': 'bezier'
                                }
                            },
                            {
                                selector: 'node:selected',
                                style: { 'border-color': '#e67e22', 'border-width': 4 }
                            }
                        ],
                        layout: { name: 'dagre', rankDir: 'TB', nodeSep: 80, rankSep: 150 }
                    });

                    const prereqMap = {};
                    cy.nodes().forEach(node => {
                        const prereqId = node.data('prerequisiteId');
                        if (prereqId) {
                            if (!prereqMap[prereqId]) prereqMap[prereqId] = [];
                            prereqMap[prereqId].push(node.data('id'));
                        }
                    });

                    function updateDependents(selectedId) {
                        const dependents = prereqMap[selectedId];
                        if (!dependents) return;
                        dependents.forEach(depId => {
                            const depNode = cy.getElementById(depId);
                            const prereqId = depNode.data('prerequisiteId');
                            let prereqSatisfied = true;
                            if (prereqId && !cy.getElementById("C" + prereqId).hasClass('selected')) prereqSatisfied = false;

                            if (prereqSatisfied) {
                                depNode.style('background-color', '#3498db');
                            }
                        });
                    }

                    cy.nodes().on('click', evt => {
                        const node = evt.target;
                        if (node.data('status') !== 'eligible') return;
                        const id = node.data('id');
                        const selectedSet = selectedBySemester[currentSemester] || new Set();

                        if (selectedSet.has(id)) {
                            selectedSet.delete(id);
                            node.removeClass('selected');
                        } else {
                            selectedSet.add(id);
                            node.addClass('selected');
                        }
                        selectedBySemester[currentSemester] = selectedSet;

                        updateDependents(id);
                        updateSummary();
                    });

                    updateSummary();
                });
        }

        function updateSummary() {
            const summary = document.getElementById("summary-box");
            const entries = Object.entries(selectedBySemester);
            if (entries.length === 0) { summary.innerHTML = "No courses selected yet."; return; }

            let html = `<u>Planned Courses:</u><br>`;
            for (const [sem, courses] of entries) {
                if (courses.size > 0) {
                    const courseNames = [...courses].map(id => courseLabelMap[id] || id);
                    html += `Semester ${sem}: <strong>${courseNames.join(", ")}</strong><br>`;
                }
            }
            summary.innerHTML = html;
        }

        async function savePlan() {
            if (!selectedBySemester[currentSemester] || selectedBySemester[currentSemester].size === 0) {
                alert("No courses selected for this semester.");
                return;
            }

            const allCourses = Array.from(selectedBySemester[currentSemester]).map(cid => ({
                semester: currentSemester,
                courseId: cid.replace('C', '')
            }));

            await Promise.all(allCourses.map(c =>
                fetch('/api/students/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentEmail, courseId: c.courseId })
                })
            ));

            if (currentSemester < 8) currentSemester++;
            document.getElementById('sem-header').textContent = `Semester Planner Flowchart (Semester ${currentSemester})`;
            loadGraph();
        }

        async function discardPlan() {
            const plannedSet = selectedBySemester[currentSemester];
            if (!plannedSet || plannedSet.size === 0) {
                alert("No planned courses to discard for this semester.");
                return;
            }

            const plannedIds = Array.from(plannedSet).map(cid => parseInt(cid.substring(1)));
            await fetch(`/api/students/discard-plan?email=${studentEmail}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(plannedIds)
            });

            selectedBySemester[currentSemester] = new Set();
            if (currentSemester > 1) currentSemester--;
            document.getElementById('sem-header').textContent = `Semester Planner Flowchart (Semester ${currentSemester})`;
            alert(`Semester plan discarded. Moved back to semester ${currentSemester}.`);
            loadGraph();
        }

        document.getElementById('save-plan-btn').addEventListener('click', savePlan);
        document.getElementById('discard-plan-btn').addEventListener('click', discardPlan);

        loadGraph();
    </script>
</body>

</html>
